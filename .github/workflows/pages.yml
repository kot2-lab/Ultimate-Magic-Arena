name: Deploy Ultimate Magic Arena

on:
  push:
    branches:
      - release/ver-1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v6
      - name: Run consolidated game and API tests
        run: npm test
      - name: Prepare the public site directory
        run: mkdir -p _site
      - name: Copy only runtime files to the public site
        run: cp index.html style.css script.js _site/
      - name: Copy game modules and version archive
        run: cp -R src assets versions _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish the game site
        id: deployment
        uses: actions/deploy-pages@v4
